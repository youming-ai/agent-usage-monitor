name: Release

# release-please watches main: it keeps a "release PR" up to date (next
# version computed from conventional commits + CHANGELOG). Merging that PR
# cuts the tag + GitHub Release, and the SAME run then builds and attaches the
# per-platform binaries. Versioning and building share one workflow, so the
# tag created with GITHUB_TOKEN doesn't need a PAT to trigger the build.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: aum-darwin-arm64
          # Cross-compile the Intel build on the Apple Silicon runner; the
          # scarce macos-13 (Intel) runners used to leave releases hanging.
          - os: macos-latest
            target: x86_64-apple-darwin
            name: aum-darwin-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: aum-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: aum-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz aum
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  upload:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      # ponytail: sign each tarball with the release private key so
      # src/updater/mod.rs and install.sh can verify integrity before
      # installing. `MINISIGN_SECRET_KEY` holds the key file contents exactly
      # as printed by `minisign -G` (including the "untrusted comment" /
      # "trusted comment" lines); `MINISIGN_PASSWORD` is only needed if that
      # key was generated with a passphrase (minisign reads it from this env
      # var non-interactively). See the maintainer setup steps in the PR
      # description / commit message for the exact commands.
      - name: Sign release artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key_file"
          for tarball in *.tar.gz; do
            minisign -S -s "$key_file" -m "$tarball"
          done

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            *.tar.gz
            *.minisig
