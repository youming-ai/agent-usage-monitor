name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: aum-darwin-arm64
          # Cross-compile the Intel build on the Apple Silicon runner; the
          # scarce macos-13 (Intel) runners used to leave releases hanging.
          - os: macos-latest
            target: x86_64-apple-darwin
            name: aum-darwin-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: aum-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: aum-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz aum
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: '*.tar.gz'

  # Regenerate the Homebrew formula in youming-ai/homebrew-tap with the new
  # version and per-platform sha256. Requires a TAP_GITHUB_TOKEN secret (a PAT
  # with contents:write on the tap repo); the step no-ops if it is absent.
  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "TAP_GITHUB_TOKEN not set; skipping Homebrew tap update."
            exit 0
          fi

          ver="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          sha() { curl -fsSL "$base/aum-$1.tar.gz" -o "/tmp/$1.tgz"; sha256sum "/tmp/$1.tgz" | cut -d' ' -f1; }
          DA="$(sha darwin-arm64)"; DI="$(sha darwin-amd64)"
          LA="$(sha linux-arm64)";  LI="$(sha linux-amd64)"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/youming-ai/homebrew-tap.git" tap
          cat > tap/Formula/aum.rb <<EOF
          class Aum < Formula
            desc "Real-time terminal monitor for Claude Code & Codex API usage"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${ver}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/aum-darwin-arm64.tar.gz"
                sha256 "${DA}"
              end
              on_intel do
                url "${base}/aum-darwin-amd64.tar.gz"
                sha256 "${DI}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/aum-linux-arm64.tar.gz"
                sha256 "${LA}"
              end
              on_intel do
                url "${base}/aum-linux-amd64.tar.gz"
                sha256 "${LI}"
              end
            end

            def install
              bin.install "aum"
            end

            test do
              assert_match "aum #{version}", shell_output("#{bin}/aum --version")
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formula already up to date."
          else
            git add Formula/aum.rb
            git commit -m "aum ${ver}"
            git push
          fi
